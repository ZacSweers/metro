import org.gradle.api.tasks.testing.Test

gradle.beforeProject { project ->
    if (project.path == ':compiler' || project.path == ':compiler-tests') {
        project.afterEvaluate {
            if (!project.plugins.hasPlugin('java')) {
                return
            }
            project.tasks.withType(Test).configureEach { task ->
                task.doFirst { runningTask ->
                    println('Compiler experiment: task=' + runningTask.path + ', maxParallelForks=' + runningTask.maxParallelForks + ', heap=' + runningTask.maxHeapSize)
                    def junitProperties = runningTask.systemProperties.findAll { key, value -> key.startsWith('junit.') }
                    println('Compiler experiment explicit JUnit JVM properties: ' + junitProperties)
                }
                if (project.path == ':compiler') {
                    def forks = project.providers.gradleProperty('metro.experiment.legacyForks').orNull
                    if (forks != null) {
                        task.maxParallelForks = Integer.parseInt(forks)
                    }
                } else {
                    def parallelism = project.providers.gradleProperty('metro.experiment.compilerJUnitThreads').orNull
                    if (parallelism != null) {
                        task.systemProperty('junit.jupiter.execution.parallel.config.strategy', 'fixed')
                        task.systemProperty('junit.jupiter.execution.parallel.config.fixed.parallelism', parallelism)
                        task.systemProperty('junit.jupiter.execution.parallel.config.fixed.max-pool-size', parallelism)
                        task.systemProperty('junit.jupiter.execution.parallel.config.fixed.saturate', 'true')
                    }
                    def modeSuites = [
                        'dev.zacsweers.metro.compiler.FastInitBoxTestGenerated*',
                        'dev.zacsweers.metro.compiler.ContributionProvidersBoxTestGenerated*',
                        'dev.zacsweers.metro.compiler.OmitRedundantMirrorsIrOnlyClassesBoxTestGenerated*',
                    ]
                    def shard = project.providers.gradleProperty('metro.experiment.compilerShard').orNull
                    if (shard == 'modes') {
                        modeSuites.each { task.filter.includeTestsMatching(it) }
                    } else if (shard == 'base') {
                        modeSuites.each { task.filter.excludeTestsMatching(it) }
                    } else if (shard != null) {
                        throw new GradleException('Unknown compiler shard: ' + shard)
                    }
                }
                if (project.path == ':compiler-tests' && project.providers.gradleProperty('metro.experiment.compilerJfr').orNull == 'true') {
                    def recording = project.layout.buildDirectory.file('compiler-ci.jfr').get().asFile
                    def settings = project.rootProject.file('scripts/compiler-ci.jfc')
                    task.jvmArgs('-XX:StartFlightRecording=filename=' + recording.absolutePath + ',settings=' + settings.absolutePath + ',dumponexit=true,maxsize=128m')
                }
            }
        }
    }
}

gradle.beforeProject { project ->
    project.afterEvaluate {
        project.tasks.withType(Test).configureEach { task ->
            if (System.getenv('EXPERIMENT_PROFILE_NESTED') == 'true') {
                task.systemProperty('metro.testkitProfile', 'true')
            }
        }
    }
}

gradle.beforeProject { project ->
    if (project.path == ':gradle-plugin') {
        project.afterEvaluate {
            project.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach { task ->
                if (task.name != 'functionalTest') {
                    return
                }
                def selectedClasses = [
        'dev.zacsweers.metro.gradle.extensions.circuit.CircuitWebTest',
        'dev.zacsweers.metro.gradle.incremental.BindingContainerICTests',
        'dev.zacsweers.metro.gradle.incremental.AssistedInjectionICTests',
        'dev.zacsweers.metro.gradle.incremental.BindingContainerInclusionICTests',
        'dev.zacsweers.metro.gradle.MetroHiddenDependenciesTest',
        'dev.zacsweers.metro.gradle.incremental.ICTests',
        'dev.zacsweers.metro.gradle.VersionCompatibilityTest',
        'dev.zacsweers.metro.gradle.InteropConfigurationTest',
        'dev.zacsweers.metro.gradle.incremental.NativeICTests',
        'dev.zacsweers.metro.gradle.SuspendProvidersConfigurationTest',
        'dev.zacsweers.metro.gradle.RuntimeTracingConfigurationTest',
                ]
                def jvmClasses = [
                    'dev.zacsweers.metro.gradle.extensions.circuit.CircuitWebTest*',
                    'dev.zacsweers.metro.gradle.InteropConfigurationTest*',
                    'dev.zacsweers.metro.gradle.incremental.GraphExtensionICTests*',
                    'dev.zacsweers.metro.gradle.VersionCompatibilityTest*',
                    'dev.zacsweers.metro.gradle.MetroHiddenDependenciesKmpTest*',
                    'dev.zacsweers.metro.gradle.incremental.BindingContainerICTests*',
                    'dev.zacsweers.metro.gradle.incremental.BindingContainerMultibindingICTests*',
                    'dev.zacsweers.metro.gradle.incremental.GenerateContributionProvidersICTests*',
                    'dev.zacsweers.metro.gradle.incremental.DefaultBindingICTests*',
                    'dev.zacsweers.metro.gradle.incremental.HiltAggregatedDepsICTests*',
                    'dev.zacsweers.metro.gradle.extensions.circuit.CircuitNativeTest*',
                    'dev.zacsweers.metro.gradle.incremental.KmpCommonSourcesICTests*',
                ]
                def shard = project.providers.gradleProperty('metro.experiment.functionalShard').orNull
                if (shard == 'jvm-base') {
                    jvmClasses.each { task.filter.includeTestsMatching(it) }
                } else if (shard == 'jvm-other') {
                    jvmClasses.each { task.filter.excludeTestsMatching(it) }
                } else if (shard == 'base') {
                    selectedClasses.each { task.filter.includeTestsMatching(it) }
                } else if (shard == 'other') {
                    selectedClasses.each { task.filter.excludeTestsMatching(it) }
                } else if (shard != null) {
                    throw new GradleException('Unknown functional shard: ' + shard)
                }
            }
        }
    }
}
