name: IDE Integration Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      ide:
        description: 'IDE to test (e.g., "IU:2025.3.2") or "all"'
        type: string
        default: 'all'

concurrency:
  group: 'ide-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-slim
    outputs:
      full: ${{ steps.changes.outputs.full }}
      docs: ${{ steps.changes.outputs.docs }}
      idea: ${{ steps.changes.outputs.idea }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/classify-changes
        id: changes
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  generate-matrix:
    name: Generate IDE matrix
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-slim
    outputs:
      ide-matrix: ${{ steps.matrix.outputs.ide-matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate IDE matrix
        id: matrix
        # language=bash
        run: |
          input_ide="${{ github.event.inputs.ide }}"
          if [[ -n "$input_ide" ]] && [[ "$input_ide" != "all" ]]; then
            json=$(echo "[\"$input_ide\"]" | jq -c .)
          else
            # Read non-comment, non-empty lines; strip trailing comments
            json=$(grep -v '^#' ide-integration-tests/ide-versions.txt \
              | grep -v '^[[:space:]]*$' \
              | sed 's/ #.*//' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "ide-matrix=$json" >> "$GITHUB_OUTPUT"

  build-metro:
    name: Build Metro artifacts
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
          konan: true

      - name: Publish Metro to functionalTestRepo
        run: ./gradlew :installForFunctionalTest --quiet

      - name: Upload Metro artifacts
        uses: actions/upload-artifact@v7
        with:
          name: metro-repo
          path: build/functionalTestRepo
          retention-days: 1

  ide-tests:
    needs:
      - changes
      - generate-matrix
      - build-metro
    if: needs.changes.outputs.full == 'true'
    name: "IDE / ${{ matrix.ide }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ide: ${{ fromJson(needs.generate-matrix.outputs.ide-matrix) }}
    env:
      METRO_PREBUILT: true

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          # AS's Gradle processor needs the Android SDK to complete SdkSync.
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - parallel:
          - name: Download Metro artifacts
            uses: actions/download-artifact@v8
            with:
              name: metro-repo
              path: build/functionalTestRepo

          - name: Setup Gradle
            uses: ./.github/actions/setup-gradle
            with:
              encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
              # Keep one IDE-specific Gradle cache writer on main.
              cache-read-only: ${{ github.ref != 'refs/heads/main' || matrix.ide != fromJson(needs.generate-matrix.outputs.ide-matrix)[0] }}

          - name: Install aria2 and xvfb
            run: |
              sudo apt-get update
              sudo apt-get install -y aria2 xvfb

          - name: Filter IDE version for this matrix entry
            run: |
              echo "${{ matrix.ide }}" > ide-integration-tests/ide-versions.txt
              echo "IDE_SLUG=${IDE//:/-}" >> "$GITHUB_ENV"
            env:
              IDE: ${{ matrix.ide }}

          - name: Write local.properties for Android Studio
            if: startsWith(matrix.ide, 'AS:')
            run: echo "sdk.dir=$ANDROID_HOME" > ide-integration-tests/test-project/local.properties

      # We don't cache IDE downloads with a separate cache step because they download in a few seconds
      - name: Download IDE
        run: |
          df -Pk .
          ide-integration-tests/download-ides.sh
          df -Pk .

      - name: Run IDE tests
        # IntelliJ Platform plugin and dependency resolution occasionally fails on remote I/O.
        # Retry once with a fresh dependency lookup and a stacktrace.
        run: |
          # Track free disk space through extraction and IDE startup during cleanup validation.
          python3 -u - <<'PY' &
          import subprocess
          import time
          while True:
              subprocess.run(["df", "-Pk", "."], check=False)
              time.sleep(30)
          PY
          disk_monitor=$!
          trap 'kill "$disk_monitor" 2>/dev/null || true' EXIT
          set +e
          ./gradlew -p ide-integration-tests test --quiet
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning::IDE tests failed (exit $status); retrying once"
            sleep 15
            ./gradlew -p ide-integration-tests test --quiet --stacktrace --refresh-dependencies
            status=$?
          fi
          exit $status

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ide-logs-${{ env.IDE_SLUG }}
          path: |
            ide-integration-tests/**/build/reports/**
            out/ide-tests/tests/**/log/**
            out/ide-tests/tests/**/reports/**

  ide-integration:
    if: always()
    runs-on: ubuntu-slim
    needs:
      - changes
      - generate-matrix
      - build-metro
      - ide-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-status.py ide
