name: CI experiments

on:
  workflow_dispatch:
    inputs:
      matrix:
        description: Experiment matrix JSON
        required: true
        type: string
      prebuilt:
        description: Share the TestKit repository between consumers
        type: boolean
        default: false
      producer-os:
        description: Runner for the shared repository producer
        type: string
        default: ubuntu-latest
      repository-run-id:
        description: Reuse the unchanged compiler artifacts from an earlier experiment
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Prepare shared TestKit repository
    if: ${{ inputs.prebuilt && inputs.repository-run-id == '' }}
    runs-on: ${{ inputs.producer-os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
          konan: true
      - name: Build TestKit repository
        shell: bash
        run: |
          set -o pipefail
          start=$SECONDS
          ./scripts/run-ci-gradle.sh :gradle-plugin:installForFunctionalTest --quiet --profile \
            -Dorg.gradle.configuration-cache.read-only=true \
            -Pmetro.testkitLightweightPublications=true 2>&1 | tee "$RUNNER_TEMP/preparation.log"
          printf 'elapsed_seconds=%s\n' "$((SECONDS - start))" > "$RUNNER_TEMP/preparation-timing.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: experiment-testkit-repository
          path: build/functionalTestRepo
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: experiment-preparation-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/preparation-timing.txt
            ${{ runner.temp }}/preparation.log
            build/reports/profile/**

  measure:
    name: ${{ matrix.name }}
    needs: prepare
    if: ${{ always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
          konan: ${{ matrix.suite != 'compiler' }}
          kotlin-compiler-version: ${{ matrix.kotlin }}
      - uses: actions/download-artifact@v8
        if: inputs.prebuilt
        with:
          name: experiment-testkit-repository
          path: build/functionalTestRepo
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repository-run-id || github.run_id }}
      - name: Measure workload
        env:
          RUNNER_DEBUG: '1'
          EXPERIMENT_SUITE: ${{ matrix.suite }}
          EXPERIMENT_FORKS: ${{ matrix.forks }}
          EXPERIMENT_TARGET: ${{ matrix.target }}
          EXPERIMENT_KOTLIN: ${{ matrix.kotlin }}
          EXPERIMENT_MIRRORS: ${{ matrix.mirrors }}
          EXPERIMENT_THREADS: ${{ matrix.threads }}
          EXPERIMENT_HEAP: ${{ matrix.heap }}
          EXPERIMENT_GC: ${{ matrix.gc }}
          EXPERIMENT_LEGACY_FORKS: ${{ matrix.legacy-forks }}
          EXPERIMENT_SHARD: ${{ matrix.shard }}
          EXPERIMENT_LIGHTWEIGHT: ${{ matrix.lightweight }}
          EXPERIMENT_FUNCTIONAL_SHARD: ${{ matrix.functional-shard }}
          EXPERIMENT_FILTER: ${{ matrix.filter }}
          EXPERIMENT_PROFILE_NESTED: ${{ matrix.profile-nested }}
          EXPERIMENT_JFR: ${{ matrix.jfr }}
          EXPERIMENT_PREBUILT: ${{ inputs.prebuilt }}
          EXPERIMENT_PREBUILT_COMPILER: ${{ matrix.prebuilt-compiler }}
          EXPERIMENT_FIXTURE_CACHE_MODE: ${{ matrix.fixture-cache-mode }}
          EXPERIMENT_PREPARE_STOP: ${{ matrix.prepare-stop }}
          EXPERIMENT_SERIES: ${{ matrix.series }}
        run: |
          if [[ "$EXPERIMENT_SERIES" == 'compiler-heap' ]]; then
            bash scripts/run-compiler-heap-series.sh
          else
            bash scripts/run-ci-experiment.sh
          fi
      - name: Upload measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: experiment-${{ matrix.name }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/timing.txt
            ${{ runner.temp }}/workload.log
            ${{ runner.temp }}/macos-resources.jsonl
            ${{ runner.temp }}/compiler-trials/**
            build/reports/profile/**
            compiler/build/test-results/test/*.xml
            compiler-tests/build/test-results/test/*.xml
            compiler-tests/build/compiler-ci.jfr
            gradle-plugin/build/test-results/functionalTest/*.xml
            gradle-plugin/build/functionalTest/**/build/reports/profile/**
            gradle-plugin/build/functionalTest/**/build/reports/kotlin-build/**
