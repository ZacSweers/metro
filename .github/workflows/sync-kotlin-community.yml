name: Sync Kotlin Community Branch

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-kotlin-community-branch
  cancel-in-progress: true

jobs:
  sync:
    name: Sync kotlin-community/dev
    if: github.repository == 'zacsweers/metro'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Sync branch
        run: git push --force origin HEAD:refs/heads/kotlin-community/dev
