name: CI

on:
  # Only run push on main
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  # Always run on PRs
  pull_request:

concurrency:
  group: 'ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-slim
    outputs:
      full: ${{ steps.changes.outputs.full }}
      docs: ${{ steps.changes.outputs.docs }}
      idea: ${{ steps.changes.outputs.idea }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/classify-changes
        id: changes
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs-validation.yml
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - parallel:
          - name: Configure JDK
            uses: actions/setup-java@v6
            with:
              distribution: 'zulu'
              java-version-file: .github/workflows/.java-version

          - name: Cache kempt formatter binaries
            uses: actions/cache@v6
            with:
              path: ~/.kempt/cache
              key: kempt-${{ hashFiles('.kempt.toml') }}

      - name: Install kempt
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/ZacSweers/kempt/releases/latest/download/kempt-fmt-installer.sh | sh

      - name: Pre-warm kempt cache
        run: kempt update

      - name: Check formatting
        run: kempt check

  generate-matrix:
    name: "⊹ generate compiler matrix ⊹"
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      default_kotlin_version: ${{ steps.generate.outputs.default_kotlin_version }}
      latest_kotlin_version: ${{ steps.generate.outputs.latest_kotlin_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate matrix
        id: generate
        run: ./scripts/generate-ci-matrix.sh ${{ github.event_name == 'pull_request' && '--pull-request' || '' }}

  core:
    name: core artifacts
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Core seeds the shared Linux build dependencies on main.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          konan: true
          konan-cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check root project
        run: |
          ./scripts/run-ci-gradle.sh check --continue --quiet \
            -x :compiler:test \
            -x :compiler-tests:test \
            -x :gradle-plugin:functionalTest \
            ${{ github.ref != 'refs/heads/main' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-core
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'Test Report - core'

  compatibility:
    name: "compiler / ${{ matrix.kotlin-compiler }}"
    runs-on: ubuntu-latest
    needs: [changes, generate-matrix]
    if: needs.changes.outputs.full == 'true'
    timeout-minutes: 40
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false
    env:
      METRO_TEST_OMIT_REDUNDANT_MIRRORS: ${{ matrix.kotlin-compiler == needs.generate-matrix.outputs.default_kotlin_version || matrix.kotlin-compiler == needs.generate-matrix.outputs.latest_kotlin_version }}
    permissions:
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Each compiler version refreshes its own compilation and test outputs on main.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate and test compiler
        run: |
          ./scripts/run-ci-gradle.sh :compiler:test :compiler-tests:test --continue --quiet \
            -Pmetro.generateCompilerTests \
            '-Pmetro.testCompilerVersion=${{ matrix.kotlin-compiler }}' \
            "-Pmetro.testOmitRedundantMirrors=$METRO_TEST_OMIT_REDUNDANT_MIRRORS" \
            -Pmetro.excludeJsBoxTests \
            -Pmetro.compilerTestParallelism=4 \
            -Pmetro.compilerTestHeapSize=4g \
            -Pmetro.compilerTestUseParallelGc=true \
            -Pmetro.legacyCompilerTestMaxParallelForks=2 \
            ${{ github.ref != 'refs/heads/main' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-compatibility-${{ matrix.kotlin-compiler }}
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'Test Report - compatibility / ${{ matrix.kotlin-compiler }}'

  functional-compatibility:
    name: "functional / ${{ matrix.kotlin-compiler }}"
    runs-on: ubuntu-latest
    needs: [changes, generate-matrix]
    if: needs.changes.outputs.full == 'true'
    timeout-minutes: 40
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false
    env:
      METRO_TEST_OMIT_REDUNDANT_MIRRORS: ${{ matrix.kotlin-compiler == needs.generate-matrix.outputs.default_kotlin_version || matrix.kotlin-compiler == needs.generate-matrix.outputs.latest_kotlin_version }}
      METRO_TESTKIT_CONFIGURATION_CACHE: ${{ matrix.kotlin-compiler != needs.generate-matrix.outputs.default_kotlin_version }}
    permissions:
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # NativeICTests retains its per-version toolchain coverage in this job.
          konan: true
          konan-cache-read-only: ${{ github.ref != 'refs/heads/main' || matrix.kotlin-compiler == needs.generate-matrix.outputs.default_kotlin_version }}
          kotlin-compiler-version: ${{ matrix.kotlin-compiler }}

      - name: Test Gradle plugin
        run: |
          fixture_cache_args=()
          # The default compiler keeps the fixture configuration-cache baseline covered.
          if [[ "$METRO_TESTKIT_CONFIGURATION_CACHE" == 'true' ]]; then
            fixture_cache_args+=(-Pmetro.testkitConfigurationCache=true -Pmetro.testkitConfigurationCacheReadOnly=false)
          fi
          ./scripts/run-ci-gradle.sh :gradle-plugin:functionalTest --continue --quiet \
            '-Pmetro.testCompilerVersion=${{ matrix.kotlin-compiler }}' \
            "-Pmetro.testOmitRedundantMirrors=$METRO_TEST_OMIT_REDUNDANT_MIRRORS" \
            -Pmetro.functionalTestKmpTarget=jvm \
            -Pmetro.functionalTestMaxParallelForks=2 \
            -Pmetro.testkitLightweightPublications=true \
            "${fixture_cache_args[@]}" \
            ${{ github.ref != 'refs/heads/main' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-functional-compatibility-${{ matrix.kotlin-compiler }}
          path: '**/build/reports/**'

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure()
        with:
          report_paths: 'gradle-plugin/build/test-results/functionalTest/*.xml'
          check_name: 'Test Report - Gradle compatibility / ${{ matrix.kotlin-compiler }}'

  shaded-compiler-smoke:
    name: shaded compiler / JDK 21
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Keep the build and R8 on the project's JDK 25 while making JDK 21 available for the
      # compiler-test and TestKit workers that execute the shaded compiler.
      - name: Configure test JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Capture test JDK home
        run: echo "METRO_TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Test shaded compiler
        run: |
          ./scripts/run-ci-gradle.sh :compiler-tests:test --quiet \
            -Pmetro.testJavaVersion=21 \
            "-Dorg.gradle.java.installations.paths=$METRO_TEST_JAVA_HOME" \
            --tests 'dev.zacsweers.metro.compiler.ShadedCompilerTest.optional terminal providers initialize from the shaded compiler jar' \
            --tests 'dev.zacsweers.metro.compiler.DiagnosticTestGenerated$Rich.testMissingBindingRich' \
            ${{ github.ref != 'refs/heads/main' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: Test shaded compiler through Gradle
        run: |
          ./scripts/run-ci-gradle.sh :gradle-plugin:functionalTest --quiet \
            -Pmetro.testJavaVersion=21 \
            "-Dorg.gradle.java.installations.paths=$METRO_TEST_JAVA_HOME" \
            --tests 'dev.zacsweers.metro.gradle.MetroArtifactsTest.shaded compiler renders rich diagnostics' \
            --tests 'dev.zacsweers.metro.gradle.MetroArtifactsTest.diagnosticsRenderMode is not a compilation input' \
            ${{ github.ref != 'refs/heads/main' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-shaded-compiler-smoke
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'Test Report - shaded compiler / Ubuntu JDK 21'

  js-box:
    name: ${{ matrix.suite == 'smoke' && 'web / smoke' || format('js box / {0}', matrix.suite) }}
    runs-on: ubuntu-latest
    needs: [changes, generate-matrix]
    if: needs.changes.outputs.full == 'true'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.ref != 'refs/heads/main' && '["smoke"]' || '["standard", "fast-init", "contribution-providers"]') }}
    permissions:
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate tests
        run: ./scripts/run-ci-gradle.sh :compiler-tests:generateTests --quiet ${{ github.ref != 'refs/heads/main' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: Run JS box smoke tests
        if: matrix.suite == 'smoke'
        run: |
          ./scripts/run-ci-gradle.sh :compiler-tests:test --quiet \
            --tests 'dev.zacsweers.metro.compiler.JsBoxTestGenerated$Inject$Assisted.testBasicAssistedInject' \
            --tests 'dev.zacsweers.metro.compiler.JsBoxTestGenerated$Multibindings.testMapProviderLazyValues' \
            --tests 'dev.zacsweers.metro.compiler.JsBoxTestGenerated$Suspend.testMixedSuspendChain' \
            --tests 'dev.zacsweers.metro.compiler.JsFastInitBoxTestGenerated$Dependencygraph$Sharding.testSwitchingSuspendProvidersWithShards' \
            ${{ github.ref != 'refs/heads/main' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: Run Wasm contribution hint smoke tests
        if: matrix.suite == 'smoke'
        run: |
          ./gradlew :gradle-plugin:functionalTest --quiet \
            '-Pmetro.testCompilerVersion=${{ needs.generate-matrix.outputs.latest_kotlin_version }}' \
            -Pmetro.functionalTestKmpTarget=wasmJs \
            --tests 'dev.zacsweers.metro.gradle.incremental.BindingContainerMultibindingICTests.contributionScopeChangeInMultiModuleProject*' \
            --tests 'dev.zacsweers.metro.gradle.incremental.GenerateContributionProvidersICTests.scopeChangeInContributionProviderTriggersDownstreamRecompilation*' \
            -Dorg.gradle.configuration-cache.read-only=true

      - name: Run standard JS box tests
        if: matrix.suite == 'standard'
        run: |
          ./scripts/run-ci-gradle.sh :compiler-tests:test --quiet \
            --tests 'dev.zacsweers.metro.compiler.JsBoxTestGenerated*'

      - name: Run FastInit JS box tests
        if: matrix.suite == 'fast-init'
        run: |
          ./scripts/run-ci-gradle.sh :compiler-tests:test --quiet \
            --tests 'dev.zacsweers.metro.compiler.JsFastInitBoxTestGenerated*'

      - name: Run contribution provider JS box tests
        if: matrix.suite == 'contribution-providers'
        run: |
          ./scripts/run-ci-gradle.sh :compiler-tests:test --quiet \
            --tests 'dev.zacsweers.metro.compiler.JsContributionProvidersBoxTestGenerated*'

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-js-box-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'Test Report - js box / ${{ matrix.suite }}'

  samples:
    name: samples
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          konan: true

      - name: Check samples
        run: |
          # We have to regen package locks because the kotlin yarn/node/etc build tooling is brittle
          ./gradlew -p samples kotlinWasmUpgradePackageLock kotlinUpgradePackageLock --rerun-tasks --no-build-cache --no-configuration-cache --quiet ${{ github.ref != 'refs/heads/main' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}
          ./gradlew -p samples check --continue --quiet ${{ github.ref != 'refs/heads/main' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-samples
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure()
        with:
          report_paths: 'samples/**/build/test-results/**/TEST-*.xml'
          check_name: 'Test Report - samples'

  idea-plugin:
    name: idea-plugin
    needs: changes
    if: needs.changes.outputs.idea == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # The IDEA build seeds its own dependencies and compilation outputs on main.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Test idea-plugin
        run: ./gradlew -p idea-plugin test --quiet ${{ github.ref != 'refs/heads/main' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-idea-plugin
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure()
        with:
          report_paths: 'idea-plugin/**/build/test-results/**/TEST-*.xml'
          check_name: 'Test Report - idea-plugin'

  idea-plugin-compatibility:
    name: idea-plugin compatibility
    needs: changes
    if: needs.changes.outputs.idea == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          # Static plugin verification does not use the Android SDK.
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify idea-plugin compatibility
        run: ./gradlew -p idea-plugin verifyPlugin --quiet ${{ github.ref != 'refs/heads/main' && '-Dorg.gradle.configuration-cache.read-only=true' || '' }}

      - name: Upload idea-plugin compatibility reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: idea-plugin-compatibility-reports
          path: idea-plugin/build/reports/pluginVerifier/**
          if-no-files-found: error
          retention-days: 14

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-idea-plugin-compatibility
          path: 'idea-plugin/build/reports/**'

  # Main runs cover every target on each host OS.
  multiplatform-tests:
    if: github.ref == 'refs/heads/main'
    name: multiplatform / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      checks: write
    # Windows runners default to PowerShell, which mis-parses gradle `-Pkey.with.dots=value` args
    # (splits on the dot). Forcing bash everywhere keeps `./gradlew … -P…` consistent across OSes;
    # Git Bash ships with the Windows runner image.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu-latest
          - os: windows-latest
            name: windows-latest
          - os: macos-latest
            name: macos-latest-native
            partition: native
            forks: 1
          - os: macos-latest
            name: macos-latest-portable
            partition: portable
            forks: 2
          - os: macos-latest
            name: macos-latest-runtime
            partition: runtime

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # https://github.com/gradle/actions/issues/1013
      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Each matrix row preserves its Gradle task outputs on main.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          konan: true
          konan-cache-read-only: ${{ github.ref != 'refs/heads/main' || matrix.os == 'ubuntu-latest' || contains(fromJSON('["portable", "runtime"]'), matrix.partition) }}

      # Core already covers the Linux runtime test tasks.
      - name: Check IC tests (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/run-ci-gradle.sh :gradle-plugin:functionalTest --continue --quiet \
            -Pmetro.functionalTestKmpTarget=all \
            -Pmetro.functionalTestMaxParallelForks=2 \
            -Pmetro.testkitConfigurationCache=true \
            -Pmetro.testkitConfigurationCacheReadOnly=false

      - name: Check runtime tests (macOS)
        if: runner.os == 'macOS' && matrix.partition == 'runtime'
        run: ./scripts/run-ci-gradle.sh :runtime:allTests :runtime-coroutines:allTests --continue --quiet

      - name: Check IC tests (macOS)
        if: ${{ !cancelled() && contains(fromJSON('["native", "portable"]'), matrix.partition) }}
        run: |
          ./scripts/run-ci-gradle.sh :gradle-plugin:functionalTest --continue --quiet \
            -Pmetro.functionalTestKmpTarget=all \
            -Pmetro.functionalTestMaxParallelForks=${{ matrix.forks }} \
            -Pmetro.functionalTestMacosPartition=${{ matrix.partition }} \
            -Pmetro.testkitLightweightPublications=true \
            -Pmetro.testkitConfigurationCache=true \
            -Pmetro.testkitConfigurationCacheReadOnly=false

      - name: Check runtime and IC tests (Windows)
        if: runner.os == 'Windows'
        # `all` exercises every KmpTarget entry on this OS — host native is OS-specific (macosArm64,
        # mingwX64, etc.), so each runner covers a different native target naturally.
        run: ./gradlew :runtime:allTests :runtime-coroutines:allTests :gradle-plugin:functionalTest --continue --quiet -Pmetro.functionalTestKmpTarget=all

      # This run covers the committed npm locks on every host.
      # The separate samples job regenerates its locks first.
      - name: Check samples
        if: runner.os != 'macOS' || matrix.partition == 'runtime'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ./scripts/run-ci-gradle.sh -p samples test allTests --continue --quiet
          else
            ./gradlew -p samples test allTests --continue --quiet
          fi

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-multiplatform-${{ matrix.name }}
          path: |
            **/build/reports/**

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: failure()
        with:
          report_paths: |
            **/build/test-results/**/TEST-*.xml
            samples/**/build/test-results/**/TEST-*.xml
          check_name: 'Test Report - multiplatform / ${{ matrix.name }}'

  benchmarks:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          konan: true

      - name: Build Metro benchmark
        run: |
          cd benchmark
          ./run_benchmarks.sh metro --build-only

      - name: (Fail-only) Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-benchmarks
          path: |
            **/build/reports/**

  # https://jakewharton.com/fan-in-to-a-single-required-github-action/
  final-status:
    if: always()
    runs-on: ubuntu-slim
    needs:
      - changes
      - docs
      - format
      - generate-matrix
      - core
      - compatibility
      - functional-compatibility
      - shaded-compiler-smoke
      - js-box
      - multiplatform-tests
      - benchmarks
      - idea-plugin
      - idea-plugin-compatibility
      - samples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-status.py ci

  publish:
    name: Publish snapshot (main only)
    runs-on: macos-latest
    concurrency:
      group: metro-snapshot-publish
      cancel-in-progress: false
      queue: max
    # Skipped ancestors can block publish after final-status succeeds unless status is explicit.
    if: >-
      ${{
        !cancelled() &&
        needs.final-status.result == 'success' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.repository == 'zacsweers/metro'
      }}
    needs:
      - final-status

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check snapshot revision
        id: revision
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/main
          # Markdown-only commits don't trigger CI.
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- . ':(glob,exclude)**/*.md'; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Gradle
        if: steps.revision.outputs.current == 'true'
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
          konan: true

      - name: Upload snapshot
        if: steps.revision.outputs.current == 'true'
        # Sonatype keeps giving 429 errors lately, so no need to mark this as failure for now
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SonatypeUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SonatypePassword }}
        run: ./metrow publish

  publish-idea-plugin:
    name: Publish IDEA plugin snapshot (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: metro-idea-snapshot-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    # Set this repository variable to true after the first manual EAP upload succeeds.
    if: >-
      ${{
        !cancelled() &&
        needs.final-status.result == 'success' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.repository == 'zacsweers/metro' &&
        vars.METRO_IDEA_PLUGIN_AUTOMATIC_SNAPSHOTS == 'true'
      }}
    needs:
      - final-status

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check snapshot revision
        id: revision
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/main
          # Markdown-only commits don't trigger CI.
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- . ':(glob,exclude)**/*.md'; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Gradle
        if: steps.revision.outputs.current == 'true'
        uses: ./.github/actions/setup-gradle
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Verify idea-plugin compatibility
        if: steps.revision.outputs.current == 'true'
        run: ./gradlew -p idea-plugin verifyPlugin --quiet

      - name: Publish EAP snapshot
        if: steps.revision.outputs.current == 'true'
        env:
          METRO_IDEA_PLUGIN_PRIVATE_KEY: ${{ secrets.METRO_IDEA_PLUGIN_PRIVATE_KEY }}
          METRO_IDEA_PLUGIN_PRIVATE_KEY_PASSWORD: ${{ secrets.METRO_IDEA_PLUGIN_PRIVATE_KEY_PASSWORD }}
          METRO_IDEA_PLUGIN_CERTIFICATE_CHAIN: ${{ secrets.METRO_IDEA_PLUGIN_CERTIFICATE_CHAIN }}
          ORG_GRADLE_PROJECT_intellijPlatformPublishingToken: ${{ secrets.METRO_IDEA_PLUGIN_PUBLISHING_TOKEN }}
          ORG_GRADLE_PROJECT_intellijPlatformPublishingChannels: eap
        run: ./metrow publish-idea-plugin

      - name: Upload signed plugin
        if: ${{ !cancelled() && hashFiles('idea-plugin/build/distributions/*-signed.zip') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: metro-idea-plugin-eap-${{ github.sha }}
          path: idea-plugin/build/distributions/*-signed.zip
          if-no-files-found: error
          retention-days: 14
